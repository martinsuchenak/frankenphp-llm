version: "3"

vars:
  # Auto-detect the installed PHP-ZTS version from Homebrew.
  # Override with: PHP_ZTS_PATH=/your/path task build
  PHP_ZTS_PATH:
    sh: brew --prefix php-zts 2>/dev/null || echo "/opt/homebrew/opt/php-zts"

  OUTPUT: frankenphp-custom

env:
  CGO_CFLAGS: >-
    -I{{.PHP_ZTS_PATH}}/include/php
    -I{{.PHP_ZTS_PATH}}/include/php/main
    -I{{.PHP_ZTS_PATH}}/include/php/TSRM
    -I{{.PHP_ZTS_PATH}}/include/php/Zend
    -I{{.PHP_ZTS_PATH}}/include/php/ext
    -I{{.PHP_ZTS_PATH}}/include/php/ext/date/lib
  CGO_LDFLAGS: "-L{{.PHP_ZTS_PATH}}/lib -lphp"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Compile the custom FrankenPHP binary with the frankenphp_llm extension
    cmds:
      - echo "PHP-ZTS path{{":"}} {{.PHP_ZTS_PATH}}"
      - go build -tags nowatcher -o {{.OUTPUT}}
      - echo "Built {{.OUTPUT}}"
    sources:
      - "*.go"
      - "*.c"
      - "*.h"
    generates:
      - "{{.OUTPUT}}"

  test:
    desc: Run test.php with the custom binary (requires a model in models/)
    deps: [build]
    cmds:
      - ./{{.OUTPUT}} php-cli test.php

  run:
    desc: Start FrankenPHP server with the extension loaded
    deps: [build]
    cmds:
      - ./{{.OUTPUT}} run

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  clean:
    desc: Remove the compiled binary
    cmds:
      - rm -f {{.OUTPUT}}
      - echo "Cleaned"

  models:download:
    desc: Download SmolLM2 test models from HuggingFace (~5GB total)
    cmds:
      - mkdir -p models
      - for:
          - name: SmolLM2-135M-Instruct-Q8_0.gguf
            url: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q8_0.gguf
          - name: SmolLM2-135M-Instruct-Q4_0.gguf
            url: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_0.gguf
          - name: SmolLM2-360M-Instruct-Q8_0.gguf
            url: https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/resolve/main/SmolLM2-360M-Instruct-Q8_0.gguf
          - name: SmolLM2-360M-Instruct-Q4_0.gguf
            url: https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/resolve/main/SmolLM2-360M-Instruct-Q4_0.gguf
          - name: SmolLM2-1.7B-Instruct-Q8_0.gguf
            url: https://huggingface.co/bartowski/SmolLM2-1.7B-Instruct-GGUF/resolve/main/SmolLM2-1.7B-Instruct-Q8_0.gguf
          - name: SmolLM2-1.7B-Instruct-Q4_0.gguf
            url: https://huggingface.co/bartowski/SmolLM2-1.7B-Instruct-GGUF/resolve/main/SmolLM2-1.7B-Instruct-Q4_0.gguf
          - name: tinyllama-1.1b-1t-openorca.Q8_0.gguf
            url: https://huggingface.co/TheBloke/TinyLlama-1.1B-1T-OpenOrca-GGUF/resolve/main/tinyllama-1.1b-1t-openorca.Q8_0.gguf
        cmd: |
          if [ -f "models/{{.ITEM.name}}" ]; then
            echo "SKIP (exists): models/{{.ITEM.name}}"
          else
            echo "Downloading {{.ITEM.name}}..."
            curl -L --progress-bar -o "models/{{.ITEM.name}}" "{{.ITEM.url}}"
          fi

  models:download:extra:
    desc: Download additional models (Llama 3.2 1B, Qwen2.5 0.5B, Qwen3 1.7B)
    cmds:
      - mkdir -p models
      - for:
          - name: Llama-3.2-1B-Instruct-Q8_0.gguf
            url: https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q8_0.gguf
          - name: Qwen2.5-0.5B-Instruct-Q8_0.gguf
            url: https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q8_0.gguf
          - name: Qwen3-1.7B-Q8_0.gguf
            url: https://huggingface.co/bartowski/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q8_0.gguf
        cmd: |
          if [ -f "models/{{.ITEM.name}}" ]; then
            echo "SKIP (exists): models/{{.ITEM.name}}"
          else
            echo "Downloading {{.ITEM.name}}..."
            curl -L --progress-bar -o "models/{{.ITEM.name}}" "{{.ITEM.url}}"
          fi

  models:clean:
    desc: Remove downloaded model files
    cmds:
      - rm -f models/*.gguf
